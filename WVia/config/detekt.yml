build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 1

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 120
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 9
    ignoreDefaultParameters: true
    ignoreDataClasses: true
  LargeClass:
    active: true
    threshold: 800
  CyclomaticComplexMethod:
    active: true
    threshold: 25
  NestedBlockDepth:
    active: true
    threshold: 6
  ComplexCondition:
    active: true
    threshold: 5
  TooManyFunctions:
    active: false

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: true

exceptions:
  active: true
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: false

naming:
  active: true
  MatchingDeclarationName:
    active: false
  FunctionParameterNaming:
    active: true
    parameterPattern: '[a-z][A-Za-z0-9]*'
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
    privatePropertyPattern: '(_)?[A-Za-z][A-Za-z0-9]*'

performance:
  active: true
  SpreadOperator:
    active: false

potential-bugs:
  active: true
  UnsafeCast:
    active: false
  HasPlatformType:
    active: false

style:
  active: true
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  WildcardImport:
    active: false
  ThrowsCount:
    active: false
  NewLineAtEndOfFile:
    active: true
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
  UselessCallOnNotNull:
    active: true
  MayBeConst:
    active: true
  ModifierOrder:
    active: true
  ProtectedMemberInFinalClass:
    active: true
  UnnecessaryInheritance:
    active: true
  SerialVersionUIDInSerializableClass:
    active: true

formatting:
  active: true
  android: true
  autoCorrect: true
  NoUnusedImports:
    active: true
  ModifierOrdering:
    active: true
  CommentSpacing:
    active: true
  Filename:
    active: true
  ImportOrdering:
    active: false
  NoWildcardImports:
    active: false
  MaximumLineLength:
    active: false
  Indentation:
    active: false
